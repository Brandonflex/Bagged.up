name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (audit · lint · types · tests · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: dependency security audit
        run: npm audit --audit-level=low

      - name: lint (HTML + JS)
        run: npm run lint

      - name: typecheck (JS via JSDoc)
        run: npm run typecheck

      - name: design system (tokens, contrast, brand marks)
        run: npm run design

      - name: tests (storefront integrity suite)
        run: npm test

      - name: build (static export check)
        run: npm run build

      - name: layout (real browser, alignment, sticky bar, review card)
        run: npm run layout

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-export-${{ github.sha }}
          path: dist
          retention-days: 7
